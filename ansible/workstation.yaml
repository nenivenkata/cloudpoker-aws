---
- name: Configure an optional Ubuntu lab administration host
  hosts: lab
  become: true
  tasks:
    - name: Install basic administration tools and distribution Docker engine
      ansible.builtin.apt:
        name: [git, curl, unzip, jq, python3, python3-pip, docker.io]
        state: present
        update_cache: true
    - name: Enable the Docker service
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
    - name: Install pip support for Docker modules
      ansible.builtin.apt:
        name: python3-docker
        state: present
