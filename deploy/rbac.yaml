apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudpoker-deployer
  namespace: cloudpoker
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [cloudpoker]
    verbs: [get, patch, update, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudpoker-deployer
  namespace: cloudpoker
subjects:
  - kind: Group
    name: cloudpoker-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: cloudpoker-deployer
  apiGroup: rbac.authorization.k8s.io
