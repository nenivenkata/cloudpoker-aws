apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudpoker
  namespace: cloudpoker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpoker
  namespace: cloudpoker
spec:
  # Sessions are in memory: one replica until shared storage is implemented.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloudpoker
  template:
    metadata:
      labels:
        app: cloudpoker
    spec:
      serviceAccountName: cloudpoker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: CLOUDPOKER_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cloudpoker
  namespace: cloudpoker
  labels:
    app: cloudpoker
spec:
  type: ClusterIP
  selector:
    app: cloudpoker
  ports:
    - name: http
      port: 80
      targetPort: http
