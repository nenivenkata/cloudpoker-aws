grafana:
  service:
    type: ClusterIP
  persistence:
    enabled: false
  # Password is generated by the chart. Retrieve it locally; never commit it.
prometheus:
  prometheusSpec:
    retention: 24h
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 768Mi
    serviceMonitorSelectorNilUsesHelmValues: true
alertmanager:
  enabled: false
