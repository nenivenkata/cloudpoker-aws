# LOCAL, EPHEMERAL VAULT EXERCISE ONLY. Never use dev mode on AWS.
services:
  vault:
    image: hashicorp/vault:1.21
    command: server -dev -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:?Generate a temporary local token first}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports: ["127.0.0.1:8200:8200"]
    cap_add: [IPC_LOCK]
